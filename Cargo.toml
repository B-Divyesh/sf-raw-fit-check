[package]
name = "raw-fit-check"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local RAW file, preview, and editor compatibility preflight"
repository = "https://github.com/B-Divyesh/sf-raw-fit-check"
readme = "README.md"
keywords = ["raw", "photography", "compatibility", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[lib]
name = "raw_fit_check"
path = "src/lib.rs"

[[bin]]
name = "raw-fit-check"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
jpeg-decoder = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
jpeg-encoder = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
